<h2>Sign in to Glass Box</h2>
<p>Use this one-time code in the browser where you started:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 4px">
  {{ .Token }}
</p>
<p>Or open this link on any device, then press Continue:</p>
<p>
  <a
    href="{{ if .RedirectTo }}{{ .RedirectTo }}{{ else }}{{ .SiteURL }}/auth/callback{{ end }}?token_hash={{ .TokenHash }}&amp;type=email"
    >Sign in to Glass Box</a
  >
</p>
<p>
  Only the newest email works. If you didn't request this, you can ignore it.
</p>
